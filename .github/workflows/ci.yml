name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build locked library
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Check all configured axiom reports
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomCheck.lean > axiom_report.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('AxiomCheck.lean').read_text(encoding='utf-8')
          expected = re.findall(r'^\s*#print axioms (\S+)[ \t]*$', src, re.M)
          raw = Path('axiom_report.txt').read_text(encoding='utf-8')
          pat = re.compile(
              r"^'(?P<name>\S+)'[ \t]+(?:depends on axioms:\s*"
              r"\[(?P<axioms>[^\]]*)\]|does not depend on any axioms)[ \t]*$",
              re.M,
          )
          matches = list(pat.finditer(raw))
          names = [m.group('name') for m in matches]
          if not expected or names != expected or pat.sub('', raw).strip():
              raise SystemExit('Axiom audit output incomplete, malformed, or out of order')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for m in matches:
              axioms = {x.strip() for x in (m.group('axioms') or '').split(',') if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f'Unexpected axioms in {m.group("name")}: {axioms - allowed}')
          print(f'Checked {len(names)} axiom reports; only foundational axioms found.')
          PY
